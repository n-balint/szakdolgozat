[package]
name = "app"
version = "0.1.0"
edition = "2021"

[dependencies]
csv = "1.3.0"
eframe = "0.29.1"
egui = "0.29.1"
rfd = "0.15.0"
tree-sitter-sequel = "0.3.5"
tree-sitter-cql = { path = "../tree-sitter-cql"}
uuid = { version = "1.10.0", features = ["v4"] }
tree-sitter = "0.22.6"
polars = { version = "0.44.2", features = ["cum_agg", "is_unique", "streaming", "polars-ops"] }
itertools = "0.13.0"
ndarray = "0.16.1"
pretty_env_logger = "0.5.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
strip = true
